name: Build and Push Multi-Arch Docker Images

# Security note: third-party actions are pinned by tag (the repo's historical
# convention). CodeQL's actions/unpinned-tag rule will still flag them. To
# silence it, replace each tag with a 40-char commit SHA and keep the tag as
# a trailing comment:
#   uses: docker/build-push-action@<sha>  # v7
# Resolve with: gh api repos/<owner>/<repo>/commits/<tag> --jq .sha

on:
  push:
    # Every branch gets built and pushed, tagged with its own branch name
    # (see the metadata steps below) -- main included, so it gets :latest
    # (enabled only on the default branch in the metadata steps) the moment
    # something lands there, with no separate manual trigger required.
    branches:
      - '**'
    paths-ignore:
      - 'LICENSE'
      - 'README.md'
      - 'TODO.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'LICENSE'
      - 'README.md'
      - 'TODO.md'
  workflow_dispatch:

# Least-privilege default at the workflow scope. Each job also sets its own
# permissions block so CodeQL sees an explicit declaration per job.
permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_BACKEND: tiritibambix/itransfer-backend
  IMAGE_FRONTEND: tiritibambix/itransfer-frontend

jobs:
  # Guards against building the same commit twice for the same ref (e.g. a
  # re-run with no new push, or workflow_dispatch right after a push that
  # already built it) -- multi-arch builds aren't free, and main now builds
  # on every push, so this keeps that from wasting CI minutes and Docker Hub
  # pushes on a no-op. workflow_dispatch always bypasses the skip, so a
  # manual rebuild of an unchanged commit still works if you ask for it.
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - name: Restore last built commit for this ref
        uses: actions/cache/restore@v6
        with:
          path: last_commit.txt
          key: last-commit-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: last-commit-${{ github.ref_name }}-

      - name: Read last built commit
        id: read
        run: |
          if [ -f last_commit.txt ]; then
            echo "last_commit=$(cat last_commit.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "last_commit=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare commits
        id: compare
        run: |
          if [ "${{ github.sha }}" = "${{ steps.read.outputs.last_commit }}" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "No new commit for this ref. Skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "New commit detected or manual trigger."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save new commit hash to cache
        if: steps.compare.outputs.skip == 'false'
        run: echo "${{ github.sha }}" > last_commit.txt

      - name: Update cache
        if: steps.compare.outputs.skip == 'false'
        uses: actions/cache/save@v6
        with:
          path: last_commit.txt
          key: last-commit-${{ github.ref_name }}-${{ github.run_id }}

  audit:
    runs-on: ubuntu-24.04
    needs: check
    if: needs.check.outputs.skip == 'false'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Bare `pip-audit` with no target audits whatever happens to be
      # installed in the current environment -- which, without the `-r`
      # flag, was only pip-audit's own tooling deps (never this project's
      # requirements.txt, since nothing installs it). That's not just
      # pointless, it's actively fragile: a CVE in pip-audit's own
      # transitive deps (e.g. CacheControl's filelock) fails every build on
      # this repo regardless of this project's real dependencies. `-r`
      # resolves and audits requirements.txt specifically, so the report is
      # scoped to what iTransfer actually ships.
      #
      # Even with `--no-deps`, pip-audit's `-r` mode still shells out to a
      # real `pip install --dry-run` to resolve/report on each entry, which
      # invokes mysqlclient's PEP 517 build backend for metadata -- it needs
      # `pkg-config` and the MySQL/MariaDB client headers to do that at all,
      # mysqlclient has no prebuilt wheel. backend/Dockerfile installs
      # exactly these system packages before its own `pip install`; mirror
      # that here instead of fighting pip-audit's flags.
      - name: Check dependencies with pip-audit
        run: |
          docker run --rm -v $(pwd):/app -w /app python:3.11-slim sh -c " \
          apt-get update && \
          apt-get install -y --no-install-recommends build-essential default-libmysqlclient-dev pkg-config && \
          python -m venv venv && \
          . venv/bin/activate && \
          pip install --upgrade pip setuptools && \
          pip install pip-audit && \
          pip-audit -r requirements.txt"

  # Building arm64 on an amd64 runner under QEMU emulation crashes Node's V8
  # with "qemu: uncaught target signal 4 (Illegal instruction)" during `npm
  # install` -- a known QEMU user-mode-emulation gap (V8 emits instructions
  # the emulated CPU model doesn't handle), not anything in this repo's
  # code. It also silently ran for ~6h before GitHub's job timeout killed
  # it, since the hang was inside a single combined multi-platform build
  # step with no visible progress.
  #
  # Fix: build each platform natively instead of emulating. GitHub now
  # provides free Linux arm64-hosted runners for public repos
  # (ubuntu-24.04-arm), so amd64 and arm64 each build on their own real
  # hardware, with no QEMU involved at all. Each platform is pushed by
  # digest only (no final tag yet); a separate merge job then combines the
  # two digests into one multi-arch manifest list and applies the real
  # tags. This is the pattern documented at
  # https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
  build-backend:
    runs-on: ${{ matrix.runner }}
    needs: [check, audit]
    if: needs.check.outputs.skip == 'false'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      # Only the labels matter here (baked into each per-platform image's
      # config) -- the real, final tags are applied once in the merge job
      # below, after all platforms are combined into one manifest list.
      - name: Extract Docker metadata (backend)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=backend-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.platform }}
          provenance: false

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-backend-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-backend:
    runs-on: ubuntu-24.04
    needs: [check, build-backend]
    if: needs.check.outputs.skip == 'false'
    permissions:
      contents: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-backend-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # :latest only on the default branch; every other branch gets a tag
      # named after itself, e.g. feat/rework -> feat-rework (the action
      # replaces '/' and any other character a Docker tag disallows with
      # '-'; this is the standard convention, the same idea as GitLab's
      # CI_COMMIT_REF_SLUG), plus a short-SHA tag for traceability back to
      # the exact commit.
      - name: Extract Docker metadata (backend)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.version }}

  build-frontend:
    runs-on: ${{ matrix.runner }}
    needs: [check, audit]
    if: needs.check.outputs.skip == 'false'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Extract Docker metadata (frontend)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=frontend-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.platform }}
          provenance: false

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-frontend-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-frontend:
    runs-on: ubuntu-24.04
    needs: [check, build-frontend]
    if: needs.check.outputs.skip == 'false'
    permissions:
      contents: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-frontend-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata (frontend)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.version }}

  update-dockerhub-description:
    runs-on: ubuntu-24.04
    needs: [check, merge-backend, merge-frontend]
    # Only the default branch should own the public Docker Hub description --
    # branch builds push their own image tags but must not overwrite it.
    if: |
      needs.check.outputs.skip == 'false' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Backend Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ env.IMAGE_BACKEND }}
          readme-filepath: ./README.md

      - name: Update Frontend Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ env.IMAGE_FRONTEND }}
          readme-filepath: ./README.md

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Dotfiles (.git, .env, .aws, credentials, ...) must never be served, and
    # must never fall through to the SPA index.html fallback below -- without
    # this, try_files + error_page would answer 200 to every probe, making
    # each one look alive to credential scanners. A clean 403 instead ends the
    # guessing. .well-known is kept reachable for ACME / security.txt.
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri /index.html;
    }

    error_page 404 /index.html;
}

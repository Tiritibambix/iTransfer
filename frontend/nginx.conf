# tusd (-behind-proxy) trusts X-Forwarded-Proto to build the absolute
# upload URL it returns to the client. When this container sits behind
# another reverse proxy that already terminates TLS, that proxy's own
# X-Forwarded-Proto (https) must win over this server's own $scheme (http,
# since that's what it received) -- otherwise tusd would hand back an
# http:// URL and the browser would block it as mixed content on an https
# page. Falls back to $scheme when nothing is set (local/no outer proxy).
map $http_x_forwarded_proto $itransfer_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Dotfiles (.git, .env, .aws, credentials, ...) must never be served, and
    # must never fall through to the SPA index.html fallback below -- without
    # this, try_files + error_page would answer 200 to every probe, making
    # each one look alive to credential scanners. A clean 403 instead ends the
    # guessing. .well-known is kept reachable for ACME / security.txt.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Resumable (tus protocol) uploads: proxied straight through to tusd so
    # the browser only ever talks to this one origin. Buffering is disabled
    # and the body size unbounded, same reasoning as the backend's reverse
    # proxy requirements for large transfers (see README).
    #
    # proxy_pass's target is a variable, not a bare hostname: with a literal
    # hostname nginx resolves "tusd" once at config load / startup and
    # refuses to start at all ("host not found in upstream") if tusd isn't
    # already up and registered on the network yet -- a real race with
    # docker-compose's `depends_on`, which only waits for the container to
    # start, not for it to be network-ready. Routing through a variable
    # defers resolution to request time, using Docker's embedded DNS
    # (127.0.0.11), so nginx starts regardless and only the /files/ requests
    # that land before tusd is reachable get an error.
    resolver 127.0.0.11 valid=10s;
    location /files/ {
        set $tusd_upstream http://tusd:8080;
        proxy_pass $tusd_upstream/files/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        client_max_body_size 0;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $itransfer_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }

    error_page 404 /index.html;
}
